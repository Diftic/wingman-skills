[pytest]
testpaths = tests
# Run from the wingman-ai root so the api module (needed by the skill's
# __init__.py) is importable:
#   PYTHONPATH=skills/sc_navigator python -m pytest skills/sc_navigator/tests
# importlib mode keeps the generic "tests" package name from colliding with
# other skills' test packages during a full-repo run.
pythonpath = .
addopts = --import-mode=importlib
