module: skills.wai_message_board.main
name: WaiMessageBoard
api_version: 3
display_name: WAI Message Board
author: Mallachi
version: 0.3.0
auto_activate: true
discoverable_by_default: false
tags:
  - Utility
description:
  en: >-
    A shared room for Wingmen. Everything said to a Wingman with this skill goes into the room,
    and a Wingman talks to another simply by saying its name: the other one hears it and answers
    in its own voice, with its own tools. A limit stops Wingmen talking among themselves until you
    speak again. Needs Wingman 3.2.11 or later.
discovery_keywords:
  - message board
  - talk to another wingman
  - ask another wingman
  - wingman room
  - wingman network
  - roleplay
prompt: |
  You share a room with other Wingmen (listed below), and everything said in it is heard by all.
  To talk to another Wingman, say their name in what you say, e.g. "Professor, what does that
  cost?". They will answer on their own a moment later; don't wait for it or answer for them.
  Only call on another Wingman when it helps the user or fits your character. When you need
  context from the room or from another Wingman's conversation, use read_board_chat.
custom_properties:
  - id: role
    name: Role in the room
    hint: What this Wingman is for, shown to the others, e.g. "Research partner - prices, loadouts, stats; searches the web".
    value: ""
    required: false
    property_type: string
  - id: answers
    name: Answers when named
    hint: Whether this Wingman answers when another Wingman says its name in the room.
    value: true
    required: false
    property_type: boolean
  - id: share_chat
    name: Share my chat
    hint: Put this Wingman's conversation with you into the room, so the others hear it. Off keeps your conversation private (and deletes what was shared at the next load); what it says to other Wingmen in the room is still heard. The limit on Wingman lines only resets when you speak to a Wingman that shares its chat.
    value: true
    required: false
    property_type: boolean
  - id: room_tools
    name: Use tools in the room
    hint: Whether this Wingman may use its tools (skills, MCPs, commands such as key presses) when another Wingman talks to it. Switch off for a ship AI if you don't want other Wingmen to trigger its commands.
    value: true
    required: false
    property_type: boolean
  - id: max_banter
    name: Max Wingman lines in a row
    hint: How many lines Wingmen may say to each other before they wait for you to speak again (1 to 20).
    value: 6
    required: false
    property_type: number
  - id: poll_seconds
    name: Listen every (seconds)
    hint: How often the skill checks the room. Checking costs nothing; only a line naming this Wingman wakes its AI.
    value: 2
    required: false
    property_type: number
  - id: max_tool_steps
    name: Max tool calls per answer
    hint: How many tool calls this Wingman may make while answering another Wingman (0 to 8).
    value: 4
    required: false
    property_type: number
  - id: board_directory
    name: Room folder
    hint: Leave empty for the default. Every Wingman in the room must use the same folder; a shared network folder links PCs.
    value: ""
    required: false
    property_type: directory
