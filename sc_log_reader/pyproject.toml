[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-log-reader"
version = "0.5.1"
description = "Independent Star Citizen log reader with data-only update instructions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["regex>=2024.11.6"]

[project.scripts]
sc-log-reader = "sc_log_reader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sc_log_reader = ["data/*.json"]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.12"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM"]
